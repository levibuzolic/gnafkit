app = "gnafkit"
primary_region = "syd"
swap_size_mb = 512

[build]
  dockerfile = "Dockerfile"

[env]
  GNAFKIT_DB_PATH = "/data/gnaf.sqlite"
  GNAFKIT_SKIP_SYNC = "1"
  HOST = "0.0.0.0"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 8
    hard_limit = 16

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"

[mounts]
  source = "gnaf_data"
  destination = "/data"
  initial_size = "20gb"

[[restart]]
  policy = "on-failure"
  retries = 10
